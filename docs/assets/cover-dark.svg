<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/>
    </marker>
    <marker id="arrowStrong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f81f7"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#0d1117"/>


  <!-- ① 原文快照 -->
  <g>
    <rect x="70" y="30" width="250" height="132" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="94" y="62" font-size="13" fill="#8b949e" letter-spacing="0.6">原文快照</text>
    <text x="94" y="92" font-size="16" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">raw/source.txt</text>
    <line x1="94" y1="108" x2="296" y2="108" stroke="#21262d" stroke-width="1"/>
    <text x="94" y="132" font-size="13" fill="#8b949e" font-family="ui-monospace, Consolas, monospace">sha256: f466d2…27bb</text>
    <text x="94" y="152" font-size="13" fill="#8b949e">295 字节 · 未被改动</text>
  </g>

  <!-- 箭头 1 -->
  <line x1="322" y1="96" x2="392" y2="96" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ② 引文 -->
  <g>
    <rect x="400" y="30" width="330" height="132" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="424" y="62" font-size="13" fill="#8b949e" letter-spacing="0.6">你引的那一句</text>
    <text x="424" y="92" font-size="16" font-weight="600" fill="#e6edf3" font-family="ui-monospace, Consolas, monospace">quotes[0]</text>
    <line x1="424" y1="108" x2="706" y2="108" stroke="#21262d" stroke-width="1"/>
    <text x="424" y="132" font-size="13" fill="#c9d1d9">「标准大气压（101.325 kPa）下，</text>
    <text x="424" y="152" font-size="13" fill="#c9d1d9">　纯水的沸点是 100 ℃。」</text>
  </g>

  <!-- 箭头 2 -->
  <line x1="732" y1="96" x2="802" y2="96" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ③ 主张 -->
  <g>
    <rect x="810" y="30" width="320" height="132" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="834" y="62" font-size="13" fill="#8b949e" letter-spacing="0.6">你的主张</text>
    <text x="834" y="92" font-size="16" font-weight="600" fill="#e6edf3" font-family="ui-monospace, Consolas, monospace">claim</text>
    <line x1="834" y1="108" x2="1106" y2="108" stroke="#21262d" stroke-width="1"/>
    <text x="834" y="132" font-size="13" fill="#c9d1d9">标准大气压（101.325 kPa）下，</text>
    <text x="834" y="152" font-size="13" fill="#c9d1d9">纯水的沸点是 100 ℃</text>
  </g>

  <!-- 定位徽章：从引文往下 -->
  <line x1="565" y1="164" x2="565" y2="198" stroke="#2f81f7" stroke-width="1.5" marker-end="url(#arrowStrong)"/>
  <g>
    <rect x="455" y="202" width="220" height="52" rx="8" fill="#0c2d6b" stroke="#79c0ff" stroke-width="1.2"/>
    <text x="565" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#2f81f7">逐字定位 · 不改任何字符</text>
    <text x="565" y="243" text-anchor="middle" font-size="12" fill="#2f81f7" font-family="ui-monospace, Consolas, monospace">mode: exact</text>
  </g>

  <!-- 说明：三级 -->
  <text x="688" y="224" font-size="12" fill="#8b949e">命中不到 → 降级 normalized</text>
  <text x="688" y="242" font-size="12" fill="#8b949e">再不到 → space-insensitive</text>
  <text x="688" y="260" font-size="12" fill="#8b949e">三级都不到 → 不许入库</text>

  <!-- 终端 -->
  <g>
    <rect x="70" y="294" width="1060" height="216" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="94" cy="426" r="5" fill="#30363d"/>
    <circle cx="112" cy="426" r="5" fill="#30363d"/>
    <circle cx="130" cy="426" r="5" fill="#30363d"/>
    <line x1="70" y1="334" x2="1130" y2="334" stroke="#21262d" stroke-width="1"/>

    <text x="94" y="366" font-size="14" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">$ proofline check demo/entries</text>
    <text x="94" y="392" font-size="14" fill="#3fb950" font-family="ui-monospace, Consolas, monospace">扫描 3 条 | pass=3 fixed=0 dirty=0 hard=0</text>

    <text x="94" y="426" font-size="14" fill="#e6edf3" font-family="ui-monospace, Consolas, monospace">$ proofline status 2026-01-01-demo-boiling-100 demo/entries</text>
    <text x="94" y="452" font-size="14" fill="#c9d1d9">受控　　　<tspan fill="#3fb950">是</tspan><tspan fill="#8b949e">（2026-11-22T13:47:22 · create）</tspan></text>
    <text x="94" y="474" font-size="14" fill="#c9d1d9">能引用　　<tspan fill="#3fb950">是</tspan><tspan fill="#8b949e">（来源确实这么说过）</tspan></text>
    <text x="94" y="496" font-size="14" fill="#c9d1d9">能下判断　<tspan fill="#db6d28">否</tspan><tspan fill="#8b949e">（还缺世界层面的结论，或不在标准层）</tspan></text>
  </g>

  <!-- 右下角注释 -->
  <text x="1130" y="532" text-anchor="end" font-size="12" fill="#6e7681">零运行时依赖 · 537 个测试</text>
</svg>
