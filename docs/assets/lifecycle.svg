<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
    <marker id="arBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>

  <text x="600" y="46" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2328">一条主张的一生</text>
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#59636e">四步。只有第一步改条目库，每一步都有失败的出口。</text>

  <!-- ① new -->
  <g>
    <rect x="60" y="106" width="248" height="150" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
    <text x="80" y="136" font-size="11" fill="#8c959f" letter-spacing="1">① 写进来</text>
    <text x="80" y="166" font-size="18" font-weight="600" fill="#0969da" font-family="ui-monospace, Consolas, monospace">new</text>
    <text x="80" y="196" font-size="12" fill="#3d444d">给齐五样：原文、引文、</text>
    <text x="80" y="214" font-size="12" fill="#3d444d">主张、出处、依据</text>
    <text x="80" y="242" font-size="11" fill="#8c959f">写入前先校验一遍，不过就拒</text>
  </g>

  <!-- 箭头 -->
  <line x1="316" y1="181" x2="344" y2="181" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ② check -->
  <g>
    <rect x="352" y="106" width="248" height="150" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
    <text x="372" y="136" font-size="11" fill="#8c959f" letter-spacing="1">② 校一遍</text>
    <text x="372" y="166" font-size="18" font-weight="600" fill="#0969da" font-family="ui-monospace, Consolas, monospace">check</text>
    <text x="372" y="196" font-size="12" fill="#3d444d">全库扫，六道检查逐条过</text>
    <text x="372" y="214" font-size="12" fill="#3d444d">出四态</text>
    <text x="372" y="242" font-size="11" fill="#8c959f">--fix 修能修的</text>
  </g>

  <line x1="608" y1="181" x2="636" y2="181" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ③ status -->
  <g>
    <rect x="644" y="106" width="248" height="150" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
    <text x="664" y="136" font-size="11" fill="#8c959f" letter-spacing="1">③ 判一次</text>
    <text x="664" y="166" font-size="18" font-weight="600" fill="#0969da" font-family="ui-monospace, Consolas, monospace">status</text>
    <text x="664" y="196" font-size="12" fill="#3d444d">读时重算：两个维度、</text>
    <text x="664" y="214" font-size="12" fill="#3d444d">三个答案</text>
    <text x="664" y="242" font-size="11" fill="#8c959f">不缓存，每次都从原文重算</text>
  </g>

  <line x1="900" y1="181" x2="928" y2="181" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ④ view -->
  <g>
    <rect x="936" y="106" width="204" height="150" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
    <text x="956" y="136" font-size="11" fill="#8c959f" letter-spacing="1">④ 用出去</text>
    <text x="956" y="166" font-size="18" font-weight="600" fill="#0969da" font-family="ui-monospace, Consolas, monospace">view / map</text>
    <text x="956" y="196" font-size="12" fill="#3d444d">证据册给人看，</text>
    <text x="956" y="214" font-size="12" fill="#3d444d">地图给 AI 看</text>
    <text x="956" y="242" font-size="11" fill="#8c959f">只读，不改库</text>
  </g>

  <!-- 产出文件 -->
  <text x="60" y="300" font-size="11" fill="#8c959f" letter-spacing="1.2">每一步产出什么</text>

  <g>
    <rect x="60" y="314" width="248" height="112" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
    <text x="78" y="340" font-size="11" fill="#59636e">entries/&lt;id&gt;/</text>
    <text x="78" y="362" font-size="12" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">entry.md</text>
    <text x="78" y="382" font-size="12" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">raw/source.txt</text>
    <text x="78" y="404" font-size="11" fill="#8c959f">.trace.jsonl 里多一条 create</text>

    <rect x="352" y="314" width="248" height="112" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
    <text x="370" y="340" font-size="11" fill="#59636e">终端输出</text>
    <text x="370" y="364" font-size="12" fill="#1a7f37" font-family="ui-monospace, Consolas, monospace">扫描 3 条 | pass=3</text>
    <text x="370" y="386" font-size="11" fill="#8c959f">不改文件（除非 --fix）</text>
    <text x="370" y="410" font-size="11" fill="#59636e">退出码：0 / 1 / 2</text>

    <rect x="644" y="314" width="248" height="112" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
    <text x="662" y="340" font-size="11" fill="#59636e">终端输出</text>
    <text x="662" y="362" font-size="12" fill="#1f2328">受控 / 来源 / 世界</text>
    <text x="662" y="382" font-size="12" fill="#1f2328">能引用 / 能下判断</text>
    <text x="662" y="406" font-size="11" fill="#8c959f">不落盘，每次现算</text>

    <rect x="936" y="314" width="204" height="112" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
    <text x="954" y="340" font-size="11" fill="#59636e">两处</text>
    <text x="954" y="362" font-size="12" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">证据册.html</text>
    <text x="954" y="382" font-size="12" fill="#1f2328" font-family="ui-monospace, Consolas, monospace">课程地图.html</text>
    <text x="954" y="406" font-size="11" fill="#8c959f">可 --md / --json</text>
  </g>

  <!-- 失败出口 -->
  <line x1="60" y1="458" x2="1140" y2="458" stroke="#d8dee4"/>
  <text x="60" y="492" font-size="11" fill="#8c959f" letter-spacing="1.2">三个失败出口（↩ 标的是回到第几步）</text>

  <g>
    <rect x="60" y="506" width="340" height="96" rx="8" fill="#ffebe9" stroke="#ff8182"/>
    <text x="80" y="532" font-size="13" font-weight="600" fill="#a40e26">new 被拒</text>
    <text x="360" y="532" text-anchor="end" font-size="13" fill="#a40e26" font-family="ui-monospace, Consolas, monospace">↩ ①</text>
    <text x="80" y="556" font-size="12" fill="#3d444d">引文定位不到 → 三级都不到，不许入库</text>
    <text x="80" y="578" font-size="11" fill="#a40e26">什么都没有留下。回去核对原文。</text>

    <rect x="420" y="506" width="340" height="96" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="440" y="532" font-size="13" font-weight="600" fill="#7d4e00">check 报 dirty</text>
    <text x="740" y="532" text-anchor="end" font-size="13" fill="#7d4e00" font-family="ui-monospace, Consolas, monospace">↩ ②</text>
    <text x="440" y="556" font-size="12" fill="#3d444d">能修但需要你确认</text>
    <text x="440" y="578" font-size="11" fill="#7d4e00">跑 --fix，改完自动补一条 fix 留痕</text>

    <rect x="780" y="506" width="360" height="96" rx="8" fill="#ffebe9" stroke="#ff8182"/>
    <text x="800" y="532" font-size="13" font-weight="600" fill="#a40e26">status 报未受控</text>
    <text x="1120" y="532" text-anchor="end" font-size="13" fill="#a40e26" font-family="ui-monospace, Consolas, monospace">↩ ①</text>
    <text x="800" y="556" font-size="12" fill="#3d444d">内容和入库记录对不上</text>
    <text x="800" y="578" font-size="11" fill="#a40e26">仍在库里，能读能查，但不再当依据</text>
  </g>

  <!-- 回头箭头 -->

  <text x="600" y="648" text-anchor="middle" font-size="12" fill="#8c959f">四步里只有第一步改条目库；后三步都是读——status 和 view 都从原文重算，不缓存结论。</text>
</svg>
